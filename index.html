<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>485报文解析工具 - 自定义数据分组</title>
    <style>
        :root {
            --bg: #1a1d23;
            --surface: #21252b;
            --surface2: #282c34;
            --border: #3a3f4b;
            --text: #e1e4e8;
            --text2: #a0a6b0;
            --accent: #61afef;
            --accent2: #56b6c2;
            --green: #98c379;
            --orange: #e5c07b;
            --red: #e06c75;
            --purple: #c678dd;
            --yellow: #f0c929;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --radius: 8px;
            --radius-sm: 5px;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
        .app-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 16px; }
        .header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .header .logo { display: flex; align-items: center; gap: 10px; font-size: 1.25em; font-weight: 700; color: var(--accent); }
        .header .subtitle { font-size: 0.85em; color: var(--text2); margin-left: auto; text-align: right; line-height: 1.4; }
        .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 18px 20px; box-shadow: var(--shadow); }
        .card-title { font-weight: 700; font-size: 0.9em; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .card-title::before { content: ''; display: inline-block; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
        .input-row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
        .input-field { flex: 1; min-width: 250px; padding: 12px 15px; background: var(--surface2); border: 2px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-mono); font-size: 0.9em; letter-spacing: 0.4px; transition: border-color 0.2s; outline: none; }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(97, 175, 239, 0.08); }
        .btn { padding: 10px 18px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.85em; transition: all 0.2s; white-space: nowrap; font-family: var(--font-sans); }
        .btn-primary { background: var(--accent); color: #1a1d23; }
        .btn-primary:hover { background: #7cc4ff; box-shadow: 0 4px 14px rgba(97, 175, 239, 0.3); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-sm { padding: 6px 12px; font-size: 0.78em; border-radius: 4px; }
        .btn-success { background: var(--green); color: #1a1d23; font-weight: 700; }
        .btn-success:hover { background: #a8d98a; }
        .btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 4px 10px; font-size: 0.75em; border-radius: 3px; cursor: pointer; transition: all 0.15s; }
        .btn-danger:hover { background: var(--red); color: #fff; }
        .btn-save { background: var(--purple); color: #fff; font-size: 0.78em; padding: 6px 10px; }
        .btn-save:hover { background: #d68cf0; }

        .group-list { display: flex; flex-direction: column; gap: 10px; max-height: 450px; overflow-y: auto; padding-right: 4px; }
        .group-item { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--surface2); border-radius: 6px; border: 1px solid var(--border); transition: border-color 0.2s; }
        .group-item:hover { border-color: #555; }
        .group-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .group-row label { font-size: 0.76em; color: var(--text2); white-space: nowrap; }
        .group-item input[type="text"] { width: 85px; padding: 5px 7px; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-family: var(--font-sans); font-size: 0.82em; }
        .group-item input[type="number"] { width: 55px; padding: 5px 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-family: var(--font-mono); font-size: 0.8em; text-align: center; }
        .group-item input.wide-input { width: 70px; }
        .group-item select { padding: 5px 6px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 3px; font-size: 0.78em; }
        .group-advanced { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: #1a1d23; border-radius: 5px; border: 1px dashed #3a3f4b; margin-top: 2px; }
        .group-advanced.hidden { display: none; }
        .btn-add-group { background: transparent; border: 2px dashed var(--accent); color: var(--accent); cursor: pointer; border-radius: 6px; padding: 10px 16px; font-weight: 600; font-size: 0.85em; transition: all 0.2s; text-align: center; width: 100%; }
        .btn-add-group:hover { background: #1e3a5f40; border-style: solid; }
        .saved-configs-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
        .saved-config-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; font-size: 0.75em; cursor: pointer; transition: all 0.2s; }
        .saved-config-tag:hover { border-color: var(--accent); color: var(--accent); }
        .saved-config-tag .del-saved { cursor: pointer; color: var(--red); font-weight: bold; margin-left: 2px; font-size: 1.1em; }
        .saved-config-tag .del-saved:hover { color: #ff6b6b; }

        .result-vertical { display: flex; flex-direction: column; gap: 6px; max-height: 500px; overflow-y: auto; padding-right: 4px; }
        .result-row { display: flex; flex-direction: column; padding: 12px 14px; background: var(--surface2); border-radius: 6px; border-left: 3px solid var(--accent); font-family: var(--font-mono); font-size: 0.83em; transition: all 0.2s; cursor: pointer; }
        .result-row:hover { background: #2a2f3a; }
        .result-row.active-highlight { border-left-color: var(--yellow); box-shadow: 0 0 12px rgba(240, 201, 41, 0.3); background: #2a2a1f; }
        .result-row .row-main { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .result-row .row-detail { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #3a3f4b; display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.88em; }
        .result-row .field-name { font-weight: 700; color: var(--accent); min-width: 80px; font-family: var(--font-sans); font-size: 0.9em; }
        .result-row .byte-range { color: var(--text2); font-size: 0.76em; min-width: 65px; }
        .result-row .value-primary { color: var(--green); font-weight: 700; font-size: 1.15em; }
        .result-row .value-converted { color: var(--yellow); font-weight: 600; font-size: 0.9em; }
        .result-row .label-sm { font-size: 0.76em; color: #888; min-width: 50px; }
        .result-row .hex-original { color: var(--orange); }
        .result-row .hex-ordered { color: var(--purple); }
        .result-row .formula-detail { color: #888; font-size: 0.75em; }
        .divider { border-top: 1px dashed #3a3f4b; margin: 4px 0; }

        .status-bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--surface2); border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 0.8em; color: var(--text2); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-ok { background: var(--green); box-shadow: 0 0 6px rgba(152, 195, 121, 0.5); }
        .dot-err { background: var(--red); box-shadow: 0 0 6px rgba(224, 108, 117, 0.5); }

        .frame-compact { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; font-family: var(--font-mono); font-size: 0.78em; padding: 8px; background: #1a1d23; border-radius: 4px; }
        .frame-byte { display: inline-block; padding: 3px 6px; border-radius: 2px; font-weight: 600; text-align: center; cursor: pointer; transition: all 0.15s; font-size: 0.85em; }
        .frame-byte:hover { transform: scale(1.15); box-shadow: 0 0 8px rgba(255, 255, 255, 0.4); z-index: 2; }
        .byte-highlight { outline: 2px solid #fff; outline-offset: 1px; }
        .byte-active-group { outline: 2px solid var(--yellow); outline-offset: 2px; z-index: 1; animation: pulse 0.8s ease-in-out; }
        @keyframes pulse { 0%,
        100% { outline-color: var(--yellow); }
        50% { outline-color: #fff; } }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a3f4b; border-radius: 3px; }

        @media (max-width: 750px) {
            .group-row { flex-direction: column; align-items: flex-start; }
            .result-row .row-main { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
                    <rect x="2" y="6" width="32" height="24" rx="3" stroke="#61afef" stroke-width="2.5" fill="none"/>
                    <circle cx="12" cy="13" r="2" fill="#98c379"/><circle cx="18" cy="13" r="2" fill="#98c379"/>
                    <circle cx="24" cy="13" r="2" fill="#98c379"/>
                    <line x1="8" y1="20" x2="28" y2="20" stroke="#e5c07b" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>485报文解析工具</span>
            </div>
            <div class="subtitle">自定义数据分组 · 配置保存 · 点击高亮</div>
        </div>

        <div class="card">
            <div class="card-title">📥 报文输入</div>
            <div class="input-row">
                <input type="text" class="input-field" id="hexInput" placeholder="输入HEX报文，例如：12 34 56 78 9A BC DE F0" autocomplete="off" spellcheck="false">
                <button class="btn btn-outline" id="btnClear">✕ 清空</button>
            </div>
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn btn-sm btn-outline" data-example="12 34 56 78 9A BC DE F0">📋 通用数据(8字节)</button>
                <button class="btn btn-sm btn-outline" data-example="00 C8 01 2C 00 96 FF 38">📋 温度传感器</button>
                <button class="btn btn-sm btn-outline" data-example="48 65 6C 6C 6F 21">📋 ASCII示例</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🔧 自定义数据分组配置
                <span style="font-weight:400;font-size:0.72em;color:#666;">（点击「💾 保存配置」保存，点击已保存标签加载）</span>
            </div>
            <div class="group-list" id="groupConfigList"></div>
            <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <button class="btn-add-group" id="btnAddGroup">+ 添加数据分组</button>
                <button class="btn btn-sm btn-outline" id="btnResetGroups">🔄 重置为默认</button>
                <button class="btn btn-sm btn-save" id="btnSaveConfig">💾 保存当前配置</button>
                <button class="btn btn-success" id="btnConfirmGroups">✅ 确定分组，开始解析</button>
            </div>
            <div class="saved-configs-row" id="savedConfigsRow">
                <span style="font-size:0.73em;color:#666;">已保存的配置：</span>
                <span style="font-size:0.7em;color:#555;">暂无</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📊 解析结果 <span style="font-weight:400;font-size:0.72em;color:#666;">（点击字段可高亮帧中对应字节）</span></div>
            <div class="result-vertical" id="resultContainer">
                <div style="color:#555;padding:20px;text-align:center;">请先配置分组并点击<strong style="color:#61afef;">「确定分组，开始解析」</strong></div>
            </div>
            <div class="status-bar" id="statusBar" style="margin-top:10px;">
                <span class="status-dot" style="background:#888;"></span><span>就绪</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🎨 帧结构可视化 <span style="font-weight:400;font-size:0.72em;color:#666;">（点击结果字段可高亮对应字节）</span></div>
            <div class="frame-compact" id="frameVisual"><span style="color:#555;">输入报文后将在此显示</span></div>
            <div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <span style="font-size:0.78em;color:#888;">选中范围: <strong id="rangeIndicator" style="color:var(--accent);">未选择</strong></span>
                <button class="btn btn-sm btn-primary" id="btnApplyRange">📌 添加为分组</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🧮 CRC-16/Modbus 计算器</div>
            <div class="input-row">
                <input type="text" class="input-field" id="crcInput" placeholder="输入HEX字节（不含CRC）">
                <button class="btn btn-outline btn-sm" id="btnCalcCrc">计算CRC</button>
            </div>
            <div style="margin-top:6px;font-family:var(--font-mono);font-size:0.82em;color:var(--accent2);" id="crcResult"></div>
        </div>
    </div>

    <script>
        (function() {
            // ========== DOM引用 ==========
            const hexInput = document.getElementById('hexInput');
            const btnClear = document.getElementById('btnClear');
            const resultContainer = document.getElementById('resultContainer');
            const frameVisual = document.getElementById('frameVisual');
            const statusBar = document.getElementById('statusBar');
            const groupConfigList = document.getElementById('groupConfigList');
            const btnAddGroup = document.getElementById('btnAddGroup');
            const btnResetGroups = document.getElementById('btnResetGroups');
            const btnSaveConfig = document.getElementById('btnSaveConfig');
            const btnConfirmGroups = document.getElementById('btnConfirmGroups');
            const savedConfigsRow = document.getElementById('savedConfigsRow');
            const rangeIndicator = document.getElementById('rangeIndicator');
            const btnApplyRange = document.getElementById('btnApplyRange');
            const crcInput = document.getElementById('crcInput');
            const btnCalcCrc = document.getElementById('btnCalcCrc');
            const crcResult = document.getElementById('crcResult');

            let groupCounter = 0;
            let currentBytes = null;
            let currentConfigs = [];
            let selectedRange = null;
            let selectedStart = null;
            let activeGroupIndex = -1;

            const STORAGE_KEY = 'rs485_parser_configs_v2';

            // 温度单位转换
            const unitConversions = [
                { label: '无转换', factor: 1, suffix: '', special: false },
                { label: '🌡 ℃ → ℉', factor: 1.8, offset: 32, suffix: '℉', special: true },
                { label: '🌡 ℉ → ℃', factor: 0.5555555556, offset: -17.7777777778, suffix: '℃', special: true },
                { label: '🌡 ℃ → K', factor: 1, offset: 273.15, suffix: 'K', special: true },
                { label: '🌡 K → ℃', factor: 1, offset: -273.15, suffix: '℃', special: true },
                { label: '🌡 ℉ → K', factor: 0.5555555556, offset: 255.3722222222, suffix: 'K', special: true },
                { label: '🌡 K → ℉', factor: 1.8, offset: -459.67, suffix: '℉', special: true },
            ];

            const tempUnits = ['℃', '℉', 'K', '°C', '°F', '摄氏度', '华氏度', '开尔文'];

            function isTempUnit(u) { return u && tempUnits.some(t => u.trim().includes(t) || t.includes(u.trim())); }

            function hexToBytes(hexStr) {
                let c = hexStr.replace(/[\s,;\[\]{}()]+/g, '').replace(/0x/gi, '').replace(/[^0-9a-fA-F]/g, '');
                if (c.length % 2 !== 0) return { error: 'HEX长度必须为偶数' };
                if (c.length === 0) return { error: '请输入有效报文' };
                const bytes = [];
                for (let i = 0; i < c.length; i += 2) bytes.push(parseInt(c.substring(i, i + 2), 16));
                return { bytes, hex: c };
            }

            function bytesToHexStr(bytes, sep = ' ') { return bytes.map(b => b.toString(16).toUpperCase().padStart(2,
                '0')).join(sep); }

            function crc16Modbus(bytes) {
                let crc = 0xFFFF;
                for (let i = 0; i < bytes.length; i++) { crc ^= bytes[i]; for (let j = 0; j < 8; j++) crc = (crc & 0x0001) ? (
                        crc >> 1) ^ 0xA001 : crc >> 1; }
                return crc;
            }

            // ==================== 保存/加载配置 ====================
            function getSavedConfigs() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    console.error('读取配置失败:', e);
                    return [];
                }
            }

            function saveConfigsToStorage(configs) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(configs));
                    console.log('配置已保存到localStorage, 数量:', configs.length);
                } catch (e) {
                    console.error('保存配置失败:', e);
                    alert('保存失败：' + e.message);
                }
            }

            function renderSavedConfigs() {
                const saved = getSavedConfigs();
                console.log('渲染已保存配置, 数量:', saved.length);
                let html = '<span style="font-size:0.73em;color:#666;">已保存的配置：</span>';
                if (saved.length === 0) {
                    html += '<span style="font-size:0.7em;color:#555;">暂无</span>';
                } else {
                    saved.forEach((cfg, idx) => {
                        html +=
                            `<span class="saved-config-tag" data-saved-idx="${idx}" title="点击加载此配置">📁 ${cfg.name || '配置'+(idx+1)} (${cfg.groups?cfg.groups.length:0}组) <span class="del-saved" data-del-idx="${idx}">×</span></span>`;
                    });
                }
                savedConfigsRow.innerHTML = html;

                // 绑定加载事件
                savedConfigsRow.querySelectorAll('.saved-config-tag').forEach(tag => {
                    tag.addEventListener('click', function(e) {
                        if (e.target.classList.contains('del-saved')) return;
                        const idx = parseInt(this.getAttribute('data-saved-idx'));
                        console.log('点击加载配置, idx:', idx);
                        loadConfig(idx);
                    });
                });

                // 绑定删除事件
                savedConfigsRow.querySelectorAll('.del-saved').forEach(del => {
                    del.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.getAttribute('data-del-idx'));
                        console.log('点击删除配置, idx:', idx);
                        deleteConfig(idx);
                    });
                });
            }

            function loadConfig(idx) {
                const saved = getSavedConfigs();
                if (idx < 0 || idx >= saved.length) {
                    console.error('无效的配置索引:', idx);
                    return;
                }
                const cfg = saved[idx];
                console.log('加载配置:', cfg.name, '分组数:', cfg.groups.length);
                groupConfigList.innerHTML = '';
                groupCounter = 0;
                cfg.groups.forEach(g => {
                    groupConfigList.appendChild(createGroupItem(
                        g.start, g.end, g.name, g.byteOrder, g.displayFormat,
                        g.formula || 'ax+b', g.offset || '0', g.scale || '1', g.unit || '',
                        g.convertIdx || 0, g.advancedOpen || false
                    ));
                });
                updateStatus('ok', `✅ 已加载配置「${cfg.name}」`);
            }

            function deleteConfig(idx) {
                const saved = getSavedConfigs();
                if (idx < 0 || idx >= saved.length) return;
                const name = saved[idx].name;
                saved.splice(idx, 1);
                saveConfigsToStorage(saved);
                renderSavedConfigs();
                updateStatus('neutral', `已删除配置「${name}」`);
            }

            // 保存按钮事件
            btnSaveConfig.addEventListener('click', function() {
                console.log('=== 保存配置按钮被点击 ===');
                const configs = getGroupConfigs();
                console.log('当前分组配置:', configs);
                if (configs.length === 0) {
                    alert('请至少配置一个数据分组后再保存');
                    return;
                }
                const name = prompt('请输入配置名称:', '配置_' + new Date().toLocaleTimeString().replace(/:/g, '-'));
                if (!name || name.trim() === '') {
                    console.log('用户取消了保存');
                    return;
                }

                // 收集完整的分组数据
                const groupsData = [];
                const items = groupConfigList.querySelectorAll('.group-item');
                items.forEach(item => {
                    const adv = item.querySelector('.group-advanced');
                    groupsData.push({
                        name: item.querySelector('.field-name').value || '未命名',
                        start: parseInt(item.querySelector('.start-byte').value) || 0,
                        end: parseInt(item.querySelector('.end-byte').value) || 1,
                        byteOrder: item.querySelector('.byte-order').value || 'big',
                        displayFormat: item.querySelector('.display-format').value || 'uint',
                        formula: item.querySelector('.formula-select')?.value || 'ax+b',
                        offset: item.querySelector('.offset-val')?.value || '0',
                        scale: item.querySelector('.scale-val')?.value || '1',
                        unit: item.querySelector('.unit-val')?.value || '',
                        convertIdx: parseInt(item.querySelector('.unit-convert')?.value) || 0,
                        advancedOpen: adv && !adv.classList.contains('hidden')
                    });
                });

                console.log('要保存的分组数据:', groupsData);

                const saved = getSavedConfigs();
                saved.push({
                    name: name.trim(),
                    groups: groupsData,
                    timestamp: Date.now()
                });
                saveConfigsToStorage(saved);
                renderSavedConfigs();
                updateStatus('ok', `✅ 配置「${name}」已保存（共${groupsData.length}个分组）`);
                console.log('保存完成');
            });

            function buildConvOptions(selectedIdx, showTemp) {
                let o = '<option value="0">无转换</option>';
                if (showTemp) unitConversions.slice(1).forEach((c, i) => o +=
                    `<option value="${i+1}" ${(i+1)===selectedIdx?'selected':''}>${c.label}</option>`);
                return o;
            }

            function updateTempVisibility(item) {
                const unitVal = item.querySelector('.unit-val')?.value || '';
                const convSelect = item.querySelector('.unit-convert');
                const tempLabel = item.querySelector('.temp-label');
                const show = isTempUnit(unitVal);
                if (convSelect) { const cv = parseInt(convSelect.value) || 0;
                    convSelect.innerHTML = buildConvOptions(cv, show); if (!show) convSelect.value = '0'; }
                if (tempLabel) tempLabel.style.display = show ? 'inline-flex' : 'none';
            }

            function createGroupItem(startVal = null, endVal = null, nameVal = '', byteOrderVal = 'big',
                formatVal = 'uint', formulaVal = 'ax+b', offsetVal = '0', scaleVal = '1', unitVal = '',
                convertIdx = 0, advancedOpen = false) {
                groupCounter++;
                const item = document.createElement('div');
                item.className = 'group-item';
                if (startVal === null || endVal === null) {
                    const items = groupConfigList.querySelectorAll('.group-item');
                    if (items.length > 0) {
                        const le = parseInt(items[items.length - 1].querySelector('.end-byte').value) || 0;
                        startVal = le + 1;
                        endVal = le + 2;
                    } else { startVal = 0;
                        endVal = 1; }
                }
                if (!nameVal) nameVal = `字段${groupCounter}`;
                const showTemp = isTempUnit(unitVal);
                const co = buildConvOptions(convertIdx, showTemp);

                item.innerHTML = `
                    <div class="group-row">
                        <label>名称:</label><input type="text" class="field-name" value="${nameVal}" placeholder="名称">
                        <label>起始:</label><input type="number" class="start-byte" value="${startVal}" min="0">
                        <label>结束:</label><input type="number" class="end-byte" value="${endVal}" min="0">
                        <label>字节序:</label><select class="byte-order"><option value="big" ${byteOrderVal==='big'?'selected':''}>大端</option><option value="little" ${byteOrderVal==='little'?'selected':''}>小端</option></select>
                        <label>格式:</label><select class="display-format"><option value="uint" ${formatVal==='uint'?'selected':''}>无符号整数</option><option value="int" ${formatVal==='int'?'selected':''}>有符号整数</option><option value="hex" ${formatVal==='hex'?'selected':''}>十六进制</option><option value="float32" ${formatVal==='float32'?'selected':''}>浮点数</option><option value="binary" ${formatVal==='binary'?'selected':''}>二进制</option><option value="ascii" ${formatVal==='ascii'?'selected':''}>ASCII</option></select>
                        <button class="btn-toggle btn-adv-toggle">⚙️ 高级</button>
                        <button class="btn-danger btn-remove">✕</button>
                    </div>
                    <div class="group-advanced ${advancedOpen?'':'hidden'}">
                        <div class="group-row">
                            <label>公式:</label><select class="formula-select"><option value="ax+b" ${formulaVal==='ax+b'?'selected':''}>值×分辨率+偏移量</option><option value="(x+a)b" ${formulaVal==='(x+a)b'?'selected':''}>(值+偏移量)×分辨率</option></select>
                            <label>分辨率:</label><input type="number" class="scale-val wide-input" value="${scaleVal}" step="any" placeholder="1">
                            <label>偏移量:</label><input type="number" class="offset-val wide-input" value="${offsetVal}" step="any" placeholder="0">
                            <label>单位:</label><input type="text" class="unit-val" value="${unitVal}" placeholder="℃/V/kPa" style="width:80px;">
                            <span class="temp-label" style="display:${showTemp?'inline-flex':'none'};align-items:center;gap:4px;"><label>温度转换:</label><select class="unit-convert">${co}</select></span>
                        </div>
                    </div>`;
                item.querySelector('.btn-adv-toggle').addEventListener('click', function() {
                    item.querySelector('.group-advanced').classList.toggle('hidden');
                });
                const ui = item.querySelector('.unit-val');
                ui.addEventListener('input', () => updateTempVisibility(item));
                ui.addEventListener('change', () => updateTempVisibility(item));
                item.querySelector('.btn-remove').addEventListener('click', () => item.remove());
                return item;
            }

            function getGroupConfigs() {
                const configs = [];
                groupConfigList.querySelectorAll('.group-item').forEach(item => {
                    const s = parseInt(item.querySelector('.start-byte').value);
                    const e = parseInt(item.querySelector('.end-byte').value);
                    if (!isNaN(s) && !isNaN(e) && s >= 0 && e >= s) configs.push({
                        name: item.querySelector('.field-name').value || '未命名',
                        start: s,
                        end: e,
                        byteOrder: item.querySelector('.byte-order').value,
                        displayFormat: item.querySelector('.display-format').value,
                        formula: item.querySelector('.formula-select')?.value || 'ax+b',
                        offset: parseFloat(item.querySelector('.offset-val')?.value) || 0,
                        scale: parseFloat(item.querySelector('.scale-val')?.value) || 1,
                        unit: item.querySelector('.unit-val')?.value || '',
                        convertIdx: parseInt(item.querySelector('.unit-convert')?.value) || 0
                    });
                });
                return configs;
            }

            function resetGroupsToDefault() {
                groupConfigList.innerHTML = '';
                groupCounter = 0;
                groupConfigList.appendChild(createGroupItem(0, 1, '数据字段1', 'big', 'uint', 'ax+b', '0', '1', '', 0,
                false));
                groupConfigList.appendChild(createGroupItem(2, 3, '数据字段2', 'big', 'uint', 'ax+b', '0', '1', '', 0,
                false));
                groupConfigList.appendChild(createGroupItem(4, 5, '数据字段3', 'big', 'uint', 'ax+b', '0', '1', '', 0,
                false));
            }

            btnAddGroup.addEventListener('click', function() {
                groupConfigList.appendChild(createGroupItem());
                groupConfigList.scrollTop = groupConfigList.scrollHeight;
            });
            btnResetGroups.addEventListener('click', resetGroupsToDefault);

            function parseBytesByConfig(bytes, cfg) {
                const ae = Math.min(cfg.end, bytes.length - 1);
                if (cfg.start >= bytes.length) return { error: `起始字节${cfg.start}超出范围` };
                const slice = bytes.slice(cfg.start, ae + 1);
                if (slice.length === 0) return { error: '范围无效' };
                const origHex = bytesToHexStr(slice, ' ');
                const origCompact = bytesToHexStr(slice, '');
                const ordered = cfg.byteOrder === 'big' ? [...slice] : [...slice].reverse();
                const ordHex = bytesToHexStr(ordered, ' ');
                let rv = null,
                    dv = '',
                    vt = '',
                    cv = '',
                    ft = '';
                if (cfg.displayFormat === 'hex') { vt = 'hex';
                    dv = `0x${origCompact}`; } else if (cfg.displayFormat === 'binary') { vt = 'binary';
                    dv = slice.map(b => b.toString(2).padStart(8, '0')).join(' '); } else if (cfg.displayFormat ===
                    'ascii') { vt = 'ascii';
                    dv = slice.map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.').join(''); } else if (cfg
                    .displayFormat === 'float32' && slice.length === 4) { vt = 'float';
                    const buf = new ArrayBuffer(4);
                    const view = new DataView(buf); for (let i = 0; i < 4; i++) view.setUint8(i, slice[i]);
                    rv = cfg.byteOrder === 'big' ? view.getFloat32(0, false) : view.getFloat32(0, true); } else { vt =
                        'int';
                    let v = 0; if (cfg.byteOrder === 'big') { for (let i = 0; i < slice.length; i++) v = (v << 8) |
                            slice[i]; } else { for (let i = slice.length - 1; i >= 0; i--) v = (v << 8) | slice[
                            i]; }
                    rv = v; if (cfg.displayFormat === 'int') { const bits = slice.length * 8;
                        rv = v >= (1 << (bits - 1)) ? v - (1 << bits) : v; } }
                if (vt === 'int' || vt === 'float') { let av = rv; if (cfg.formula === 'ax+b' && (cfg.scale !== 1 || cfg
                        .offset !== 0)) { av = rv * cfg.scale + cfg.offset;
                        ft = `${rv}×${cfg.scale}+${cfg.offset}=${parseFloat(av.toFixed(6).toString().replace(/\.?0+$/, ''))}`; } else if (
                        cfg.formula === '(x+a)b' && (cfg.offset !== 0 || cfg.scale !== 1)) { av = (rv + cfg.offset) *
                        cfg.scale;
                        ft = `(${rv}+${cfg.offset})×${cfg.scale}=${parseFloat(av.toFixed(6).toString().replace(/\.?0+$/, ''))}`; }
                    dv = parseFloat(av.toFixed(6).toString().replace(/\.?0+$/, '')); if (cfg.unit) dv += ` ${cfg.unit}`; if (
                        isTempUnit(cfg.unit) && cfg.convertIdx > 0) { const conv = unitConversions[cfg.convertIdx]; if (
                            conv && conv.special) { let cvv = av * conv.factor + (conv.offset || 0);
                            cv = parseFloat(cvv.toFixed(4).toString().replace(/\.?0+$/, '')); if (conv.suffix) cv +=
                                ` ${conv.suffix}`; } } } else { dv = dv || rv?.toString() || ''; }
                return { origHex, ordHex, byteOrder: cfg.byteOrder, rawValue: rv, displayValue: dv, valueType: vt,
                    formulaText: ft, convertedValue: cv, offset: cfg.offset, scale: cfg.scale, unit: cfg.unit,
                    error: null, start: cfg.start, end: ae };
            }

            function parseAndRender() {
                const input = hexInput.value.trim();
                if (!input) { resultContainer.innerHTML =
                        '<div style="color:#888;padding:20px;text-align:center;">请输入报文</div>';
                    frameVisual.innerHTML = '<span style="color:#555;">输入报文后将在此显示</span>';
                    updateStatus('neutral', '请输入报文'); return; }
                const parsed = hexToBytes(input);
                if (parsed.error) { resultContainer.innerHTML =
                        `<div style="color:var(--red);padding:20px;">❌ ${parsed.error}</div>`;
                    updateStatus('error', parsed.error); return; }
                currentBytes = parsed.bytes;
                currentConfigs = getGroupConfigs();
                activeGroupIndex = -1;
                const bytes = currentBytes;
                let resultHtml = '';
                if (currentConfigs.length === 0) { resultHtml +=
                        '<div style="color:var(--orange);padding:15px;">⚠ 未配置数据分组</div>'; } else {
                    currentConfigs.forEach((cfg, idx) => {
                        const result = parseBytesByConfig(bytes, cfg);
                        const ae = Math.min(cfg.end, bytes.length - 1);
                        const bc = ae - cfg.start + 1;
                        const rt = cfg.start === ae ? `字节[${cfg.start}]` :
                            `字节[${cfg.start}~${ae}] (${bc}字节)`;
                        if (result.error) {
                            resultHtml +=
                                `<div class="result-row" style="border-left-color:var(--red);"><div class="row-main"><span class="field-name" style="color:var(--red);">⚠ ${cfg.name}</span><span class="byte-range">${rt}</span><span style="color:var(--red);">${result.error}</span></div></div>`;
                        } else {
                            resultHtml +=
                                `<div class="result-row" data-group-idx="${idx}" title="点击高亮对应字节"><div class="row-main"><span class="field-name">${cfg.name}</span><span class="byte-range">${rt}</span><span class="value-primary">${result.displayValue}</span>${result.convertedValue?`<span class="value-converted">→ ${result.convertedValue}</span>`:''}</div><div class="row-detail"><span><span class="label-sm">原字节:</span><span class="hex-original">${result.origHex}</span></span><span><span class="label-sm">字节序:</span><span class="hex-ordered">${result.ordHex}</span></span>${(result.valueType==='int'||result.valueType==='float')?`<span><span class="label-sm">原始值:</span>${result.rawValue}</span>`:''}${result.formulaText?`<span class="formula-detail">📐 ${result.formulaText}</span>`:''}</div></div>`;
                        }
                    });
                }
                if (bytes.length >= 4) { const lc = bytes[bytes.length - 2] | (bytes[bytes.length - 1] << 8); const cc =
                        crc16Modbus(bytes.slice(0, bytes.length - 2)); if (lc === cc) resultHtml +=
                        `<div class="divider"></div><div class="result-row" style="border-left-color:var(--accent2);"><div class="row-main"><span class="field-name" style="color:var(--accent2);">💡 CRC检测</span><span>符合Modbus CRC-16 (0x${cc.toString(16).toUpperCase().padStart(4,'0')})</span></div></div>`; }
                resultContainer.innerHTML = resultHtml ||
                    '<div style="color:#555;padding:20px;">无数据</div>';
                resultContainer.querySelectorAll('.result-row[data-group-idx]').forEach(row => {
                    row.addEventListener('click', function() {
                        const idx = parseInt(this.getAttribute('data-group-idx'));
                        highlightGroupInFrame(idx);
                        resultContainer.querySelectorAll('.result-row').forEach(r => r.classList
                            .remove('active-highlight'));
                        this.classList.add('active-highlight');
                    });
                });
                renderFrameVisual(bytes, currentConfigs, -1);
                updateStatus('ok', `✅ 解析完成 - ${bytes.length}字节, ${currentConfigs.length}个分组`);
            }

            function highlightGroupInFrame(idx) {
                if (idx < 0 || idx >= currentConfigs.length) return;
                activeGroupIndex = idx;
                const cfg = currentConfigs[idx];
                const allBytes = frameVisual.querySelectorAll('.frame-byte');
                allBytes.forEach(el => el.classList.remove('byte-active-group'));
                allBytes.forEach(el => {
                    const bi = parseInt(el.getAttribute('data-byte-index'));
                    if (bi >= cfg.start && bi <= cfg.end) el.classList.add('byte-active-group');
                });
                const first = frameVisual.querySelector('.byte-active-group');
                if (first) first.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            function renderFrameVisual(bytes, configs, highlightIdx = -1) {
                const bmap = new Array(bytes.length).fill(-1);
                const gcolors = [{ bg: '#1e3a5f', color: '#61afef', border: '#2a5080' }, { bg: '#1a3a2a',
                    color: '#98c379', border: '#2a5a3a' }, { bg: '#2a2a1a', color: '#e5c07b',
                    border: '#4a4a2a' }, { bg: '#2a1a2a', color: '#c678dd', border: '#4a2a4a' }, { bg: '#1a2a2a',
                    color: '#56b6c2', border: '#2a4a4a' }];
                configs.forEach((cfg, idx) => { for (let i = cfg.start; i <= cfg.end && i < bytes.length; i++) bmap[i] =
                        idx; });
                let html = '';
                for (let i = 0; i < bytes.length; i++) {
                    const hv = bytes[i].toString(16).toUpperCase().padStart(2, '0');
                    const gi = bmap[i];
                    let style = `background:#2a2a1a;color:#e5c07b;border:1px solid #4a4a2a;`;
                    let title = `字节${i}: 0x${hv}`;
                    if (gi >= 0) { const gc = gcolors[gi % gcolors.length];
                        style = `background:${gc.bg};color:${gc.color};border:1px solid ${gc.border};`;
                        title += ` [${configs[gi].name}]`; }
                    let cls = '';
                    if (selectedRange && i >= selectedRange.start && i <= selectedRange.end) cls += ' byte-highlight';
                    if (highlightIdx >= 0 && gi === highlightIdx) cls += ' byte-active-group';
                    html +=
                        `<span class="frame-byte${cls}" style="${style}" title="${title}" data-byte-index="${i}" onclick="window.handleByteClick(${i},event)">${hv}</span>`;
                }
                frameVisual.innerHTML = html;
                updateRangeIndicator();
            }

            window.handleByteClick = function(index, event) {
                if (event.shiftKey && selectedStart !== null) { selectedRange = { start: Math.min(selectedStart,
                        index), end: Math.max(selectedStart, index) }; } else { selectedStart = index;
                    selectedRange = { start: index, end: index }; }
                updateRangeIndicator();
                if (currentBytes) renderFrameVisual(currentBytes, currentConfigs, activeGroupIndex);
            };

            function updateRangeIndicator() {
                if (selectedRange) rangeIndicator.textContent =
                    `字节 ${selectedRange.start} 到 ${selectedRange.end}（共${selectedRange.end-selectedRange.start+1}字节）`;
                else rangeIndicator.textContent = '未选择';
            }

            btnApplyRange.addEventListener('click', function() {
                if (!selectedRange || !currentBytes) { alert('请先选择字节范围'); return; }
                const { start, end } = selectedRange;
                const name = prompt('字段名称:', `字段_${start}_${end}`);
                if (name === null) return;
                groupConfigList.appendChild(createGroupItem(start, end, name));
                selectedRange = null;
                selectedStart = null;
                if (currentBytes) renderFrameVisual(currentBytes, currentConfigs, activeGroupIndex);
                updateRangeIndicator();
            });

            btnConfirmGroups.addEventListener('click', function() {
                if (getGroupConfigs().length === 0) { alert('请至少配置一个数据分组'); return; }
                parseAndRender();
                this.style.transform = 'scale(0.95)';
                setTimeout(() => { this.style.transform = ''; }, 150);
            });

            btnClear.addEventListener('click', function() {
                hexInput.value = '';
                resultContainer.innerHTML =
                    '<div style="color:#555;padding:20px;">请配置分组并点击<strong style="color:#61afef;">「确定分组」</strong></div>';
                frameVisual.innerHTML = '<span style="color:#555;">输入报文后将在此显示</span>';
                currentBytes = null;
                currentConfigs = [];
                activeGroupIndex = -1;
                selectedRange = null;
                selectedStart = null;
                updateRangeIndicator();
                updateStatus('neutral', '已清空');
            });

            hexInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault();
                    btnConfirmGroups.click(); } });
            document.querySelectorAll('[data-example]').forEach(function(btn) { btn.addEventListener('click',
                function() { hexInput.value = btn.getAttribute('data-example'); }); });
            btnCalcCrc.addEventListener('click', function() {
                const parsed = hexToBytes(crcInput.value.trim());
                if (parsed.error) { crcResult.innerHTML =
                        `<span style="color:var(--red);">${parsed.error}</span>`; return; }
                const crc = crc16Modbus(parsed.bytes);
                crcResult.innerHTML =
                    `CRC: <strong>0x${crc.toString(16).toUpperCase().padStart(4,'0')}</strong> | 字节: ${(crc&0xFF).toString(16).toUpperCase().padStart(2,'0')} ${((crc>>8)&0xFF).toString(16).toUpperCase().padStart(2,'0')}`;
            });

            function updateStatus(type, message) {
                statusBar.innerHTML =
                    `<span class="status-dot ${type==='ok'?'dot-ok':type==='error'?'dot-err':''}" style="${!type?'background:#888;':''}"></span><span>${message}</span>`;
            }

            // ==================== 初始化 ====================
            console.log('🔧 485报文解析工具初始化开始...');
            resetGroupsToDefault();
            renderSavedConfigs();
            updateStatus('neutral', '就绪 - 支持配置保存/加载，点击结果高亮字节');
            hexInput.focus();
            console.log('✅ 工具初始化完成');
            console.log('  - btnSaveConfig 元素:', btnSaveConfig);
            console.log('  - localStorage 可用:', typeof localStorage !== 'undefined');
            console.log('  - 当前已保存配置数:', getSavedConfigs().length);
        })();
    </script>
</body>
</html>
