<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>个人导航 · 轻搜索</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f5f6f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 1rem;
      transition: background-color 0.2s ease;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
    }

    .logo-area {
      margin-top: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .logo-text {
      font-size: 2.5rem;
      font-weight: 600;
      color: #4e6ef2;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #4e6ef2 0%, #8b5cf6 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .search-wrapper {
      width: 100%;
      background: white;
      border-radius: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      padding: 0.7rem 1.2rem;
      transition: box-shadow 0.2s;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .search-wrapper:focus-within {
      box-shadow: 0 6px 20px rgba(78, 110, 242, 0.15), 0 2px 8px rgba(0, 0, 0, 0.08);
      border-color: #4e6ef2;
    }

    .search-icon {
      color: #9aa0a6;
      margin-right: 0.7rem;
      display: flex;
      align-items: center;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      background: transparent;
      color: #222;
    }

    .search-input::placeholder {
      color: #9aa0a6;
      font-weight: 400;
    }

    .camera-icon {
      color: #9aa0a6;
      margin-left: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .camera-icon:hover {
      color: #4e6ef2;
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      margin-bottom: -0.5rem;
    }

    .edit-btn {
      background: white;
      border: 1px solid #e0e3e8;
      padding: 0.5rem 1.4rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #4e6ef2;
      background-color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .edit-btn:hover {
      background-color: #f0f3ff;
      border-color: #4e6ef2;
      box-shadow: 0 4px 12px rgba(78, 110, 242, 0.15);
      color: #2b4bdb;
    }

    .sites-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      margin-top: 0.4rem;
    }

    .site-card {
      background: white;
      border-radius: 16px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.02);
      transition: all 0.25s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    .site-card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
      border-color: rgba(78, 110, 242, 0.15);
      background: #ffffff;
    }

    .site-img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #f2f3f7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .site-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder-icon {
      font-size: 2rem;
      color: #8e94a0;
      font-weight: 500;
    }

    .site-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      width: 100%;
      text-align: center;
    }

    .site-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.3;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-url-badge {
      font-size: 0.65rem;
      background: #f0f2f5;
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      color: #5f6368;
      font-weight: 400;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-desc {
      font-size: 0.75rem;
      color: #5f6368;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .arrow-icon {
      position: absolute;
      top: 0.5rem;
      right: 0.7rem;
      color: #b8bcc4;
      font-size: 1rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .site-card:hover .arrow-icon {
      opacity: 1;
    }

    /* 模态框样式 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal {
      background: white;
      border-radius: 24px;
      max-width: 500px;
      width: 100%;
      padding: 1.8rem 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal h3 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #8e94a0;
      line-height: 1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #3c4043;
      margin-left: 0.2rem;
    }

    .form-group input, .form-group textarea {
      padding: 0.8rem 1rem;
      border: 1px solid #e0e3e8;
      border-radius: 14px;
      font-size: 0.95rem;
      outline: none;
      background: #fafbfc;
      transition: 0.2s;
      font-family: inherit;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: #4e6ef2;
      background: white;
      box-shadow: 0 0 0 3px rgba(78,110,242,0.1);
    }

    /* 图片上传区域 */
    .image-upload-area {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }

    .image-upload-area .form-group {
      flex: 1;
    }

    .file-upload-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .file-upload-btn {
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      border: 1px dashed #4e6ef2;
      background: #f0f3ff;
      color: #4e6ef2;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }

    .file-upload-btn:hover {
      background: #e0e6ff;
      border-color: #3a56d4;
      color: #3a56d4;
    }

    .image-preview {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      background: #f2f3f7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      flex-shrink: 0;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.8rem;
      margin-top: 0.5rem;
    }

    .btn {
      padding: 0.7rem 1.6rem;
      border-radius: 24px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .btn-primary {
      background: #4e6ef2;
      color: white;
    }

    .btn-primary:hover {
      background: #3a56d4;
    }

    .btn-secondary {
      background: #f1f3f4;
      color: #3c4043;
    }

    .btn-secondary:hover {
      background: #e4e6e9;
    }

    .add-site-btn {
      margin-top: 0.3rem;
      align-self: center;
      background: transparent;
      border: 1px dashed #b9bfc9;
      color: #5f6368;
      padding: 0.6rem 2rem;
      border-radius: 28px;
      font-weight: 500;
    }

    .add-site-btn:hover {
      border-color: #4e6ef2;
      color: #4e6ef2;
      background: #f8f9ff;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      color: #9aa0a6;
      padding: 2rem;
      font-size: 0.95rem;
    }

    .or-divider {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.3rem 0;
    }

    .or-divider span {
      color: #9aa0a6;
      font-size: 0.8rem;
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0e3e8;
    }

    @media (max-width: 480px) {
      .logo-text {
        font-size: 2rem;
      }
      
      .sites-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 0.8rem;
      }
      
      .site-img {
        width: 52px;
        height: 52px;
      }

      .image-upload-area {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <span class="logo-text">我的导航</span>
    </div>

    <div class="search-wrapper">
      <span class="search-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" class="search-input" placeholder="搜索或过滤网站..." id="searchInput" autocomplete="off">
      <span class="camera-icon" title="语音搜索装饰">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </span>
    </div>

    <div class="action-bar">
      <button class="edit-btn" id="openEditModeBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        编辑导航
      </button>
    </div>

    <div class="sites-grid" id="sitesGrid"></div>

    <button class="edit-btn add-site-btn" id="addSiteBtn" style="display: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加新网站
    </button>
  </div>

  <!-- 编辑模态框 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>
        <span id="modalTitle">编辑网站</span>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </h3>
      <div class="form-group">
        <label>网站名称</label>
        <input type="text" id="siteNameInput" placeholder="例如：百度">
      </div>
      <div class="form-group">
        <label>网站地址 (URL)</label>
        <input type="url" id="siteUrlInput" placeholder="https://www.baidu.com">
      </div>
      <div class="form-group">
        <label>描述/说明</label>
        <textarea id="siteDescInput" rows="2" placeholder="全球最大的中文搜索引擎..."></textarea>
      </div>
      
      <!-- 图片区域 -->
      <div class="image-upload-area">
        <div class="file-upload-wrapper">
          <label class="file-upload-btn" for="imageFileInput">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            上传图片
          </label>
          <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
          <div class="or-divider"><span>或输入URL</span></div>
        </div>
        <div class="image-preview" id="imagePreview">
          <span id="previewPlaceholder" style="color: #9aa0a6; font-size: 0.8rem;">预览</span>
        </div>
      </div>
      <div class="form-group">
        <label>图片地址 (URL)</label>
        <input type="text" id="siteImageInput" placeholder="https://example.com/logo.png 或上传图片">
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelModalBtn">取消</button>
        <button class="btn btn-primary" id="saveSiteBtn">保存</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const DEFAULT_SITES = [
        {
          id: '1',
          name: '百度',
          url: 'https://www.baidu.com',
          desc: '全球最大的中文搜索引擎',
          image: 'https://www.baidu.com/favicon.ico'
        },
        {
          id: '2',
          name: 'GitHub',
          url: 'https://github.com',
          desc: '开发者协作平台',
          image: 'https://github.com/favicon.ico'
        },
        {
          id: '3',
          name: '知乎',
          url: 'https://www.zhihu.com',
          desc: '高质量问答社区',
          image: 'https://www.zhihu.com/favicon.ico'
        },
        {
          id: '4',
          name: '哔哩哔哩',
          url: 'https://www.bilibili.com',
          desc: '视频弹幕网站',
          image: 'https://www.bilibili.com/favicon.ico'
        }
      ];

      const STORAGE_KEY = 'personal_nav_sites_with_files';
      let sites = [];
      let editingSiteId = null;
      let isEditModeActive = false;
      let tempImageData = null; // 临时存储上传的图片base64

      const sitesGrid = document.getElementById('sitesGrid');
      const searchInput = document.getElementById('searchInput');
      const openEditModeBtn = document.getElementById('openEditModeBtn');
      const addSiteBtn = document.getElementById('addSiteBtn');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalTitle = document.getElementById('modalTitle');
      const siteNameInput = document.getElementById('siteNameInput');
      const siteUrlInput = document.getElementById('siteUrlInput');
      const siteDescInput = document.getElementById('siteDescInput');
      const siteImageInput = document.getElementById('siteImageInput');
      const imageFileInput = document.getElementById('imageFileInput');
      const imagePreview = document.getElementById('imagePreview');
      const previewPlaceholder = document.getElementById('previewPlaceholder');
      const saveSiteBtn = document.getElementById('saveSiteBtn');
      const cancelModalBtn = document.getElementById('cancelModalBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');

      function loadSites() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            sites = JSON.parse(stored);
            if (!Array.isArray(sites)) sites = [];
            sites = sites.filter(s => s && typeof s === 'object');
          } catch (e) {
            sites = [];
          }
        } else {
          sites = [...DEFAULT_SITES];
        }
        sites.forEach((site, index) => {
          if (!site.id) {
            site.id = Date.now().toString() + index;
          }
        });
      }

      function saveSitesToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sites));
      }

      function renderSites(filterText = '') {
        if (!sitesGrid) return;
        
        const filtered = sites.filter(site => {
          if (!filterText.trim()) return true;
          const keyword = filterText.trim().toLowerCase();
          return (
            (site.name && site.name.toLowerCase().includes(keyword)) ||
            (site.desc && site.desc.toLowerCase().includes(keyword)) ||
            (site.url && site.url.toLowerCase().includes(keyword))
          );
        });

        if (filtered.length === 0) {
          sitesGrid.innerHTML = `<div class="empty-message">📭 暂无网站，点击"编辑导航"或添加新网站</div>`;
          return;
        }

        sitesGrid.innerHTML = filtered.map(site => {
          const imgContent = site.image 
            ? `<img src="${escapeHtml(site.image)}" alt="${escapeHtml(site.name)}" onerror="this.parentElement.innerHTML='<span class=\'placeholder-icon\'>${escapeHtml(site.name.charAt(0))}</span>'">` 
            : `<span class="placeholder-icon">${escapeHtml(site.name ? site.name.charAt(0) : '?')}</span>`;
          
          return `
            <a class="site-card" href="${escapeHtml(site.url || '#')}" target="_blank" rel="noopener noreferrer" data-id="${escapeHtml(site.id)}">
              <div class="arrow-icon">↗</div>
              <div class="site-img">
                ${imgContent}
              </div>
              <div class="site-info">
                <div class="site-title">${escapeHtml(site.name || '未命名')}</div>
                <div class="site-url-badge">${escapeHtml(getDomain(site.url))}</div>
                <div class="site-desc">${escapeHtml(site.desc || '暂无描述')}</div>
              </div>
            </a>
          `;
        }).join('');
      }

      function escapeHtml(text) {
        if (!text) return '';
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getDomain(url) {
        try {
          if (!url) return '';
          const u = new URL(url);
          return u.hostname.replace('www.', '');
        } catch (e) {
          return url.length > 20 ? url.substring(0,20)+'…' : url;
        }
      }

      function toggleEditMode(active) {
        isEditModeActive = active;
        if (active) {
          addSiteBtn.style.display = 'inline-flex';
          openEditModeBtn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            完成编辑
          `;
          openEditModeBtn.classList.add('active-edit');
        } else {
          addSiteBtn.style.display = 'none';
          openEditModeBtn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            编辑导航
          `;
          openEditModeBtn.classList.remove('active-edit');
        }
        attachCardEvents();
      }

      function attachCardEvents() {
        const cards = document.querySelectorAll('.site-card');
        cards.forEach(card => {
          card.removeEventListener('click', cardClickHandler);
          card.addEventListener('click', cardClickHandler);
        });
      }

      function cardClickHandler(e) {
        if (isEditModeActive) {
          e.preventDefault();
          const card = e.currentTarget;
          const siteId = card.getAttribute('data-id');
          openEditModal(siteId);
        }
      }

      // 处理图片预览
      function updateImagePreview(src) {
        if (src) {
          imagePreview.innerHTML = `<img src="${escapeHtml(src)}" alt="预览">`;
        } else {
          imagePreview.innerHTML = '<span id="previewPlaceholder" style="color: #9aa0a6; font-size: 0.8rem;">预览</span>';
        }
      }

      // 处理文件上传
      function handleFileUpload(file) {
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
          tempImageData = e.target.result;
          updateImagePreview(tempImageData);
          // 清空URL输入框，优先使用上传的图片
          siteImageInput.value = '';
        };
        reader.readAsDataURL(file);
      }

      function openEditModal(siteId = null) {
        editingSiteId = siteId;
        tempImageData = null;
        
        if (siteId) {
          const site = sites.find(s => s.id === siteId);
          if (site) {
            modalTitle.textContent = '编辑网站';
            siteNameInput.value = site.name || '';
            siteUrlInput.value = site.url || '';
            siteDescInput.value = site.desc || '';
            
            // 判断图片是base64还是URL
            if (site.image && site.image.startsWith('data:')) {
              siteImageInput.value = '';
              tempImageData = site.image;
              updateImagePreview(site.image);
            } else {
              siteImageInput.value = site.image || '';
              updateImagePreview(site.image);
            }
          }
        } else {
          modalTitle.textContent = '添加新网站';
          siteNameInput.value = '';
          siteUrlInput.value = '';
          siteDescInput.value = '';
          siteImageInput.value = '';
          updateImagePreview('');
        }
        
        imageFileInput.value = '';
        modalOverlay.style.display = 'flex';
      }

      function closeModal() {
        modalOverlay.style.display = 'none';
        editingSiteId = null;
        tempImageData = null;
        imageFileInput.value = '';
      }

      function saveSiteFromModal() {
        const name = siteNameInput.value.trim();
        let url = siteUrlInput.value.trim();
        const desc = siteDescInput.value.trim();
        const imageUrl = siteImageInput.value.trim();

        if (!name) {
          alert('请填写网站名称');
          return;
        }
        if (!url) {
          alert('请填写网站地址');
          return;
        }
        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }

        // 优先使用上传的图片，其次使用URL
        const finalImage = tempImageData || imageUrl;

        if (editingSiteId) {
          const index = sites.findIndex(s => s.id === editingSiteId);
          if (index !== -1) {
            sites[index] = {
              ...sites[index],
              name,
              url,
              desc,
              image: finalImage
            };
          }
        } else {
          const newSite = {
            id: Date.now().toString(),
            name,
            url,
            desc,
            image: finalImage
          };
          sites.push(newSite);
        }

        saveSitesToStorage();
        closeModal();
        renderSites(searchInput.value);
        attachCardEvents();
      }

      function addDeleteButtonToModal() {
        if (document.getElementById('deleteSiteBtn')) return;
        const modalActions = document.querySelector('.modal-actions');
        const deleteBtn = document.createElement('button');
        deleteBtn.id = 'deleteSiteBtn';
        deleteBtn.className = 'btn btn-secondary';
        deleteBtn.style.backgroundColor = '#fee2e2';
        deleteBtn.style.color = '#b91c1c';
        deleteBtn.textContent = '删除';
        deleteBtn.addEventListener('click', function() {
          if (editingSiteId && confirm('确定要删除这个网站吗？')) {
            sites = sites.filter(s => s.id !== editingSiteId);
            saveSitesToStorage();
            closeModal();
            renderSites(searchInput.value);
            attachCardEvents();
          }
        });
        modalActions.prepend(deleteBtn);
      }

      function removeDeleteButton() {
        const btn = document.getElementById('deleteSiteBtn');
        if (btn) btn.remove();
      }

      // 监听URL输入变化更新预览
      siteImageInput.addEventListener('input', function() {
        const url = this.value.trim();
        if (url && !tempImageData) {
          updateImagePreview(url);
        } else if (!url && !tempImageData) {
          updateImagePreview('');
        }
      });

      // 文件上传事件
      imageFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          handleFileUpload(file);
        }
      });

      const observer = new MutationObserver((mutations) => {
        if (modalOverlay.style.display === 'flex' && editingSiteId) {
          addDeleteButtonToModal();
        } else {
          removeDeleteButton();
        }
      });
      observer.observe(modalOverlay, { attributes: true, attributeFilter: ['style'] });

      openEditModeBtn.addEventListener('click', () => {
        toggleEditMode(!isEditModeActive);
      });

      addSiteBtn.addEventListener('click', () => {
        openEditModal(null);
      });

      saveSiteBtn.addEventListener('click', saveSiteFromModal);
      cancelModalBtn.addEventListener('click', closeModal);
      closeModalBtn.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });

      searchInput.addEventListener('input', (e) => {
        renderSites(e.target.value);
        setTimeout(attachCardEvents, 0);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalOverlay.style.display === 'flex') {
          closeModal();
        }
      });

      // 支持拖拽上传
      imagePreview.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });

      imagePreview.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
          handleFileUpload(file);
        }
      });

      loadSites();
      renderSites();
      toggleEditMode(false);
      attachCardEvents();
    })();
  </script>
</body>
</html>
